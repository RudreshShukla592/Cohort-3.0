    <meta charset="UTF-8" />

    <link

  <body>
    <main>
      <header>
        <h1>Browser Pipeline</h1>
      </header>

      <section class="render-section">
          <h2>How Browser Renders a Webpage</h2>

          <div class="pipeline">
            <div class="step">HTML</div>

            <div class="arrow">↓</div>

            <div class="step">Parsing</div>

            <div class="arrow">↓</div>

            <div class="step">Tokenization</div>

            <div class="arrow">↓</div>

            <div class="step">DOM Tree</div>

            <div class="arrow">↓</div>

            <div class="step">CSS</div>

            <div class="arrow">↓</div>

            <div class="step">CSSOM Tree</div>

            <div class="arrow">↓</div>

            <div class="merge">DOM + CSSOM</div>

            <div class="arrow">↓</div>

            <div class="render-tree">Render Tree</div>
          </div>

          <div class="result">Final Render Tree is Created</div>
        </section>
    </main>
