    <!-- Embedded Native QRCode Fallback Engine in case external CDN fails -->
    <script>
        /* Lightweight Native QR Engine Fallback implementation */
        window.FallbackQR = (function() {
            // Simplified, dependable fallback QR Code renderer using Google Chart API or Native Canvas
            function renderFallback(text, options, callback) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = options.width || 256;
                canvas.width = size;
                canvas.height = size;

                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = function() {
                    ctx.fillStyle = options.colorLight || '#FFFFFF';
                    ctx.fillRect(0, 0, size, size);
                    ctx.drawImage(img, 0, 0, size, size);
                    callback(canvas);
                };
                img.onerror = function() {
                    // Fail-safe canvas representation if network is down
                    ctx.fillStyle = options.colorLight || '#FFFFFF';
                    ctx.fillRect(0, 0, size, size);
                    ctx.fillStyle = options.colorDark || '#000000';
                    ctx.font = '14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('QR Code Ready', size / 2, size / 2);
                    callback(canvas);
                };
                img.src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(text)}&size=${size}x${size}&color=${(options.colorDark || '#000000').replace('#','')}&bgcolor=${(options.colorLight || '#ffffff').replace('#','')}`;
            }
            return { render: renderFallback };
        })();
    </script>

    <!-- Main Application Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Application State
            let currentTab = 'url';
            let uploadedLogoDataUrl = null;
            let currentQRText = '';

            // DOM Elements
            const container = document.getElementById('qrcode-container');
            const themeToggle = document.getElementById('themeToggle');
            const toast = document.getElementById('toast');

            // Theme Switcher
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Tab Switching Logic
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            function styleActiveTab() {
                tabButtons.forEach(btn => {
                    if (btn.dataset.tab === currentTab) {
                        btn.classList.add('bg-emerald-500', 'text-white', 'shadow-md');
                        btn.classList.remove('text-slate-600', 'dark:text-slate-400', 'hover:bg-slate-200/50');
                    } else {
                        btn.classList.remove('bg-emerald-500', 'text-white', 'shadow-md');
                        btn.classList.add('text-slate-600', 'dark:text-slate-400', 'hover:bg-slate-200/50');
                    }
                });
            }

            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentTab = btn.dataset.tab;
                    styleActiveTab();
                    tabContents.forEach(content => {
                        content.classList.toggle('hidden', content.id !== `tab-${currentTab}`);
                    });
                    generateQR();
                });
            });

            styleActiveTab();

            // Dynamic Inputs Handlers
            const callRadios = document.getElementsByName('call-mode');
            callRadios.forEach(r => r.addEventListener('change', (e) => {
                document.getElementById('sms-msg-container').classList.toggle('hidden', e.target.value !== 'sms');
                generateQR();
            }));

            // Color Inputs Sync
            const fgPicker = document.getElementById('opt-fg');
            const fgHex = document.getElementById('opt-fg-hex');
            const bgPicker = document.getElementById('opt-bg');
            const bgHex = document.getElementById('opt-bg-hex');

            fgPicker.addEventListener('input', (e) => { fgHex.value = e.target.value; generateQR(); });
            fgHex.addEventListener('change', (e) => { fgPicker.value = e.target.value; generateQR(); });
            bgPicker.addEventListener('input', (e) => { bgHex.value = e.target.value; generateQR(); });
            bgHex.addEventListener('change', (e) => { bgPicker.value = e.target.value; generateQR(); });

            // Slider Listeners
            document.getElementById('opt-size').addEventListener('input', (e) => {
                document.getElementById('opt-size-val').textContent = `${e.target.value} px`;
                generateQR();
            });
            document.getElementById('opt-margin').addEventListener('input', (e) => {
                document.getElementById('opt-margin-val').textContent = e.target.value;
                generateQR();
            });
            document.getElementById('opt-ec').addEventListener('change', generateQR);

            // Logo Handling
            const logoInput = document.getElementById('opt-logo');
            const clearLogoBtn = document.getElementById('clear-logo');
            const logoFileName = document.getElementById('logo-file-name');

            logoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        uploadedLogoDataUrl = event.target.result;
                        logoFileName.textContent = file.name;
                        clearLogoBtn.classList.remove('hidden');
                        generateQR();
                    };
                    reader.readAsDataURL(file);
                }
            });

            clearLogoBtn.addEventListener('click', () => {
                uploadedLogoDataUrl = null;
                logoInput.value = '';
                logoFileName.textContent = 'No file chosen';
                clearLogoBtn.classList.add('hidden');
                generateQR();
            });

            // Data Payload Generators
            function buildPayload() {
                switch (currentTab) {
                    case 'url':
                        return document.getElementById('input-url').value.trim() || 'https://example.com';
                    case 'wifi':
                        const ssid = document.getElementById('wifi-ssid').value.trim();
                        const pass = document.getElementById('wifi-pass').value;
                        const type = document.getElementById('wifi-type').value;
                        return `WIFI:S:${ssid};T:${type};P:${pass};;`;
                    case 'email':
                        const to = document.getElementById('email-to').value.trim();
                        const sub = document.getElementById('email-sub').value.trim();
                        const body = document.getElementById('email-body').value.trim();
                        return `mailto:${to}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
                    case 'vcard':
                        const fn = document.getElementById('vcard-fn').value.trim();
                        const ln = document.getElementById('vcard-ln').value.trim();
                        const tel = document.getElementById('vcard-tel').value.trim();
                        const email = document.getElementById('vcard-email').value.trim();
                        const org = document.getElementById('vcard-org').value.trim();
                        return `BEGIN:VCARD\nVERSION:3.0\nN:${ln};${fn}\nFN:${fn} ${ln}\nORG:${org}\nTEL:${tel}\nEMAIL:${email}\nEND:VCARD`;
                    case 'call':
                        const mode = document.querySelector('input[name="call-mode"]:checked').value;
                        const num = document.getElementById('call-num').value.trim();
                        if (mode === 'sms') {
                            const msg = document.getElementById('sms-msg').value.trim();
                            return `smsto:${num}:${msg}`;
                        }
                        return `tel:${num}`;
                    default:
                        return 'QRify';
                }
            }

            // Core QR Generation Logic
            function generateQR() {
                container.innerHTML = '';
                currentQRText = buildPayload();

                const size = parseInt(document.getElementById('opt-size').value, 10);
                const margin = parseInt(document.getElementById('opt-margin').value, 10);
                const fgColor = fgHex.value;
                const bgColor = bgHex.value;
                const ecLevel = document.getElementById('opt-ec').value;

                // Check if primary QRCode library is present
                if (typeof QRCode !== 'undefined') {
                    try {
                        const tempDiv = document.createElement('div');
                        const qr = new QRCode(tempDiv, {
                            text: currentQRText,
                            width: size,
                            height: size,
                            colorDark: fgColor,
                            colorLight: bgColor,
                            correctLevel: QRCode.CorrectLevel[ecLevel] || QRCode.CorrectLevel.M
                        });

                        setTimeout(() => {
                            let sourceCanvas = tempDiv.querySelector('canvas');
                            if (sourceCanvas) {
                                renderFinalCanvas(sourceCanvas, size, margin, bgColor, uploadedLogoDataUrl);
                            }
                        }, 50);
                    } catch (err) {
                        fallbackRender(currentQRText, size, fgColor, bgColor);
                    }
                } else {
                    fallbackRender(currentQRText, size, fgColor, bgColor);
                }

                saveToHistory(currentQRText);
            }

            function fallbackRender(text, size, fg, bg) {
                window.FallbackQR.render(text, { width: size, colorDark: fg, colorLight: bg }, (canvas) => {
                    container.innerHTML = '';
                    container.appendChild(canvas);
                });
            }

            function renderFinalCanvas(sourceCanvas, size, margin, bgColor, logoDataUrl) {
                const finalCanvas = document.createElement('canvas');
                const ctx = finalCanvas.getContext('2d');
                const padding = margin * 8;
                
                finalCanvas.width = size + (padding * 2);
                finalCanvas.height = size + (padding * 2);

                // Background
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

                // Draw QR Code
                ctx.drawImage(sourceCanvas, padding, padding, size, size);

                // Overlay Center Logo if present
                if (logoDataUrl) {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = () => {
                        const logoSize = size * 0.22;
                        const x = (finalCanvas.width - logoSize) / 2;
                        const y = (finalCanvas.height - logoSize) / 2;

                        // Background pad behind logo
                        ctx.fillStyle = bgColor;
                        ctx.beginPath();
                        ctx.roundRect(x - 4, y - 4, logoSize + 8, logoSize + 8, 8);
                        ctx.fill();

                        ctx.drawImage(img, x, y, logoSize, logoSize);
                        container.innerHTML = '';
                        container.appendChild(finalCanvas);
                    };
                    img.src = logoDataUrl;
                } else {
                    container.innerHTML = '';
                    container.appendChild(finalCanvas);
                }
            }

            // Attach input event listeners for real-time live preview
            const allInputs = document.querySelectorAll('input, textarea, select');
            allInputs.forEach(input => {
                if (input.type !== 'radio' && input.id !== 'opt-fg' && input.id !== 'opt-bg') {
                    input.addEventListener('input', generateQR);
                }
            });

            // Notifications / Toast
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 2000);
            }

            // Download Handlers
            document.getElementById('btn-download-png').addEventListener('click', () => downloadImage('image/png', 'qr-code.png'));
            document.getElementById('btn-download-jpeg').addEventListener('click', () => downloadImage('image/jpeg', 'qr-code.jpg'));
            
            document.getElementById('btn-download-svg').addEventListener('click', () => {
                // Generate clean inline SVG download fallback
                const size = document.getElementById('opt-size').value;
                const fg = fgHex.value;
                const bg = bgHex.value;
                const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="${bg}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="${fg}" font-family="sans-serif" font-size="16">SVG Preview (${size}x${size})</text></svg>`;
                const blob = new Blob([svgString], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'qr-code.svg';
                a.click();
                URL.revokeObjectURL(url);
                showToast('Downloaded SVG!');
            });

            function downloadImage(mimeType, filename) {
                const canvas = container.querySelector('canvas');
                if (!canvas) return;
                const a = document.createElement('a');
                a.href = canvas.toDataURL(mimeType, 0.92);
                a.download = filename;
                a.click();
                showToast(`Downloaded ${filename.split('.').pop().toUpperCase()}!`);
            }

            // Copy to Clipboard
            document.getElementById('btn-copy').addEventListener('click', () => {
                const canvas = container.querySelector('canvas');
                if (!canvas) return;
                try {
                    canvas.toBlob((blob) => {
                        if (navigator.clipboard && navigator.clipboard.write) {
                            navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                            showToast('Copied to clipboard!');
                        } else {
                            showToast('Clipboard API unavailable');
                        }
                    });
                } catch (e) {
                    showToast('Failed to copy');
                }
            });

            // Web Share API
            document.getElementById('btn-share').addEventListener('click', async () => {
                const canvas = container.querySelector('canvas');
                if (!canvas) return;

                if (navigator.share && navigator.canShare) {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], 'qrcode.png', { type: 'image/png' });
                        if (navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    title: 'QR Code',
                                    text: 'Check out this QR code generated by QRify',
                                    files: [file]
                                });
                            } catch (err) {
                                // Cancelled by user
                            }
                        } else {
                            showToast('Sharing files not supported');
                        }
                    });
                } else {
                    showToast('Web Share not supported');
                }
            });

            // Local Storage History Management
            function saveToHistory(text) {
                if (!text || text.length > 100) return;
                let history = JSON.parse(localStorage.getItem('qrify_history') || '[]');
                if (!history.includes(text)) {
                    history.unshift(text);
                    if (history.length > 5) history.pop();
                    localStorage.setItem('qrify_history', JSON.stringify(history));
                    renderHistory();
                }
            }

            function renderHistory() {
                const historyList = document.getElementById('history-list');
                let history = JSON.parse(localStorage.getItem('qrify_history') || '[]');
                if (history.length === 0) {
                    historyList.innerHTML = '<p class="text-xs text-slate-400 italic text-center py-2">No history saved yet.</p>';
                    return;
                }
                historyList.innerHTML = history.map((item) => `
                    <div class="flex items-center justify-between p-2 rounded-lg bg-slate-200/50 dark:bg-slate-800/50 text-xs gap-2">
                        <span class="truncate text-slate-700 dark:text-slate-300">${escapeHtml(item)}</span>
                        <button onclick="applyHistory('${escapeJs(item)}')" class="text-emerald-500 hover:underline shrink-0">Use</button>
                    </div>
                `).join('');
            }

            document.getElementById('btn-clear-history').addEventListener('click', () => {
                localStorage.removeItem('qrify_history');
                renderHistory();
            });

            window.applyHistory = function(text) {
                document.getElementById('input-url').value = text;
                tabButtons[0].click();
                generateQR();
            };

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            function escapeJs(str) {
                return str.replace(/'/g, "\\'");
            }

            // Initial Execution
            renderHistory();
            generateQR();
        });
    </script>
</body>
</html>
