<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>// dsa_tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanline"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">&gt;_</span>
    <div class="brand-text">
      <h1>dsa_tracker</h1>
      <p class="subtitle">87 problems &middot; pattern-curated &middot; own your reps</p>
    </div>
  </div>
  <div class="streak-box" id="streakBox">
    <span class="streak-label">today</span>
    <span class="streak-value" id="todayCount">0</span>
  </div>
</header>

<main>

  <section class="progress-panel">
    <div class="progress-header">
      <div class="progress-title">
        <span class="progress-count"><span id="completedCount">0</span> / <span id="totalCount">87</span></span>
        <span class="progress-label">solved</span>
      </div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-ticks" id="progressTicks"></div>
    </div>

    <div class="diff-stats">
      <div class="diff-stat easy">
        <span class="diff-dot"></span>
        <span class="diff-name">Easy</span>
        <span class="diff-num"><span id="easyDone">0</span>/<span id="easyTotal">0</span></span>
      </div>
      <div class="diff-stat medium">
        <span class="diff-dot"></span>
        <span class="diff-name">Medium</span>
        <span class="diff-num"><span id="mediumDone">0</span>/<span id="mediumTotal">0</span></span>
      </div>
      <div class="diff-stat hard">
        <span class="diff-dot"></span>
        <span class="diff-name">Hard</span>
        <span class="diff-num"><span id="hardDone">0</span>/<span id="hardTotal">0</span></span>
      </div>
    </div>
  </section>

  <section class="controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="search a problem...">
    </div>

    <select id="topicFilter" class="select-control">
      <option value="all">All topics</option>
    </select>

    <select id="difficultyFilter" class="select-control">
      <option value="all">All difficulty</option>
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>

    <div class="status-toggle" id="statusToggle">
      <button class="toggle-btn active" data-status="all">All</button>
      <button class="toggle-btn" data-status="pending">Pending</button>
      <button class="toggle-btn" data-status="completed">Completed</button>
    </div>
  </section>

  <section class="topic-rail" id="topicRail"></section>

  <section class="list-wrap">
    <div class="list-head">
      <span class="col col-check"></span>
      <span class="col col-name">Problem</span>
      <span class="col col-topic">Topic</span>
      <span class="col col-diff">Difficulty</span>
      <span class="col col-platform">Platform</span>
    </div>
    <div id="problemList" class="problem-list"></div>
    <p class="empty-state" id="emptyState" hidden>No problems match this filter.</p>
  </section>

</main>

<footer>
  <span>progress saved locally in this browser &middot; edit the array in script.js to add your own problems</span>
</footer>

<script src="script.js"></script>
</body>
</html>
